# XcodeGen spec for the Supervibes Mac app.
# The .xcodeproj is generated from this file (scripts run `xcodegen generate`) and is not checked in.
name: Supervibes

options:
  bundleIdPrefix: com.supervibes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # Marks the project as checked against this Xcode, so it doesn't offer "Update to recommended
  # settings" on every regenerate. Bump it when a new Xcode asks again, and put what it suggests here.
  xcodeVersion: "27.2"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  # The API client is generated at build time from Supervibes/API/openapi.json (`npm run api:spec`).
  OpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    from: "1.0.0"
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: "1.0.0"
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: "1.0.0"

targets:
  Supervibes:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - Supervibes
      - Shared
    info:
      path: Supervibes/Info.plist
      properties:
        CFBundleDisplayName: $(SUPERVIBES_DISPLAY_NAME)
        LSApplicationCategoryType: public.app-category.productivity
        SupervibesBaseURL: $(SUPERVIBES_BASE_URL)
        # Shared with the widget: today's blocks go through this App Group (Shared/Models/WidgetShare.swift).
        SupervibesAppGroup: $(TeamIdentifierPrefix)$(SUPERVIBES_BUNDLE_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Calendar import reads the person's Google calendars through macOS Calendar (EventKit).
        NSCalendarsFullAccessUsageDescription: Supervibes shows your events beside your goals’ time so you can import the ones you need. It never changes them.
    entitlements:
      path: Supervibes/Supervibes.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(SUPERVIBES_BUNDLE_ID)
        # Release builds run with the hardened runtime, which needs this to read calendars at all.
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        # Supervibes, or Supervibes Dev for Debug builds: the name in the Dock, Finder and app menu.
        PRODUCT_NAME: $(SUPERVIBES_DISPLAY_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(SUPERVIBES_BUNDLE_ID)
        REGISTER_APP_GROUPS: YES
      configs:
        # Release only: in Debug, hardened runtime keeps Xcode from loading its preview code into
        # the app, and the canvas fails with "did not launch in 30 seconds".
        # The icons are Icon Composer documents in Supervibes/, written by scripts/app-icon.mjs;
        # Debug's is grey, so Supervibes Dev and Supervibes are easy to tell apart in the Dock.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SupervibesWidgets
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: OpenAPIGenerator

  SupervibesWidgets:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - SupervibesWidgets
      - Shared
    info:
      path: SupervibesWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(SUPERVIBES_DISPLAY_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SupervibesAppGroup: $(TeamIdentifierPrefix)$(SUPERVIBES_BUNDLE_ID)
    entitlements:
      path: SupervibesWidgets/SupervibesWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(SUPERVIBES_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SUPERVIBES_BUNDLE_ID).widgets
        REGISTER_APP_GROUPS: YES
      configs:
        # Release only, like the app: Debug builds stay previewable.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  # Runs without a host app, so tests never launch Supervibes itself.
  SupervibesTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - Tests/Snapshots
      - Shared
    dependencies:
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supervibes.mac.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Supervibes:
    build:
      targets:
        # Not for test: the tests compile Shared themselves and have no host app, so building the
        # app (and its widget, Shared twice more) only slowed every test run.
        Supervibes: [run, profile, analyze, archive]
        SupervibesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        # Classes run side by side in separate test processes, one per core.
        - name: SupervibesTests
          parallelizable: true
    archive:
      config: Release
